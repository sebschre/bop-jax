[package]
name = "bopfox-rs"
version = "0.1.0"
edition = "2021"
description = "Analytic bond-order potentials in Rust with analytic forces (port of bopjax)"
license = "MIT"
publish = false

[lib]
name = "bopfox_rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.25", optional = true, features = ["extension-module", "abi3-py311"] }

[features]
python = ["dep:pyo3"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
