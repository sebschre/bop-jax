name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # The md extra covers the JAX-MD interface; the OVITO rendering test
      # skips itself without the viz extra.
      - run: uv sync --locked --extra md
      - run: uv run pytest -q

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bopfox-rs
      - run: cargo clippy --release --all-targets --features python -- -D warnings
        working-directory: bopfox-rs
      - run: cargo test --release
        working-directory: bopfox-rs
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      # the bindings, checked against bopjax
      - run: uvx maturin develop --release
        working-directory: bopfox-rs
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
      - run: uv run pytest -q bopfox-rs/tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python -c "import bopjax; print(bopjax.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
