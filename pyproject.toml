[project]
name = "bopjax"
version = "0.4.0"
description = "Analytic bond-order potentials in JAX: energies, forces and self-consistency from automatic differentiation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
]

[project.optional-dependencies]
md = ["jax-md>=0.2.29"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bopjax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
