[project]
name = "bopjax"
version = "0.4.0"
description = "Analytic bond-order potentials in JAX: energies, forces and self-consistency from automatic differentiation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Sebastian Schreiber" }]
keywords = ["bond-order potential", "tight binding", "JAX", "molecular dynamics", "materials science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "jax>=0.4.34",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/sebschre/bop-jax"
Issues = "https://github.com/sebschre/bop-jax/issues"

[project.optional-dependencies]
md = ["jax-md>=0.2.29"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bopjax"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "benchmarks", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
